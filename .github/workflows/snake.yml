name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  gerar-cobrinha:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Gerar animações
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RogerioHenriqueRM

          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#DC143C&color_dots=#161B22,#4D0A16,#820F20,#B6162D,#DC143C

      - name: Publicar arquivos na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
